{% extends "layout.html" %}


{%block "pagecontent"%}
<div class="container">

  <div class="form-container">

    <h2>Add Blog</h2>

    <form method="POST" enctype="multipart/form-data">

      {% csrf_token %}

      <!-- Title -->
      <div class="form-group">
        <label for="title">Title</label>
        <input 
          type="text" 
          id="title" 
          name="title" 
          placeholder="Enter blog title"
          required
        >
      </div>

      <!-- Description -->
      <div class="form-group">
        <label for="description">Description</label>

        <textarea 
          id="description" 
          name="description" 
          placeholder="Write blog description"
          required
        ></textarea>
      </div>

      <!-- Image -->
      <div class="form-group">
        <label for="blog_image">Upload Image</label>

        <input 
          type="file" 
          id="blog_image" 
          name="blog_image"
          accept="image/*"
          required
        >
      </div>

      <!-- Submit Button -->
      <button type="submit">
        Submit Blog
      </button>

    </form>

  </div>

</div>
  {%endblock%}
